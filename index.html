<!doctype html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="UW creator" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>UW creator</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <style>
      html,
      body {
        width: 100%;
        height: var(--app-viewport-height, 100%);
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #071008;
        overscroll-behavior: none;
      }

      body {
        min-height: var(--app-viewport-height, 100vh);
      }

      flutter-view {
        width: 100%;
        height: var(--app-viewport-height, 100%);
        display: block;
        background-color: #071008;
      }

      :root {
        --loader-bg: #f5f7f2;
        --loader-bg-2: #edf2e9;
        --loader-primary: #287a4b;
        --loader-text: #33433a;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 17px;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(
            ellipse at 50% 43%,
            rgba(40, 122, 75, 0.09),
            transparent 38%
          ),
          radial-gradient(
            circle at top,
            var(--loader-bg-2) 0%,
            var(--loader-bg) 72%
          );
        z-index: 9999;
        transition:
          opacity 260ms ease,
          visibility 260ms ease;
      }

      #app-loader::before,
      #app-loader::after {
        position: absolute;
        z-index: -1;
        content: "";
        pointer-events: none;
      }

      #app-loader::before {
        inset: -50%;
        opacity: 0.25;
        background: linear-gradient(
          115deg,
          transparent 43%,
          rgba(40, 122, 75, 0.025) 47%,
          rgba(255, 255, 255, 0.7) 49.5%,
          rgba(40, 122, 75, 0.035) 52%,
          transparent 57%
        );
        transform: translateX(-55%);
        animation: loader-shimmer 3.8s ease-in-out infinite;
      }

      #app-loader::after {
        width: min(74vw, 430px);
        aspect-ratio: 1;
        border: 1px solid rgba(40, 122, 75, 0.06);
        border-radius: 50%;
        box-shadow:
          0 0 0 36px rgba(40, 122, 75, 0.014),
          0 0 0 72px rgba(40, 122, 75, 0.01);
        animation: loader-breathe 3s ease-in-out infinite;
      }

      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-ring {
        position: relative;
        display: flex;
        width: 198px;
        min-height: 132px;
        flex-direction: column;
        justify-content: center;
        gap: 13px;
        box-sizing: border-box;
        padding: 20px 19px;
        border: 1px solid rgba(60, 82, 64, 0.1);
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 12px 35px rgba(40, 60, 42, 0.09);
        animation: loader-breathe 3s ease-in-out infinite;
      }

      .loader-ring::before {
        width: 48%;
        height: 9px;
        border-radius: 5px;
        background: #e5eee4;
        content: "";
      }

      .loader-ring::after {
        width: 100%;
        height: 9px;
        border-radius: 5px;
        background: #edf1eb;
        box-shadow: 0 22px 0 #edf1eb;
        content: "";
        animation: menu-row-shimmer 1.7s ease-in-out infinite;
      }

      .loader-text {
        position: relative;
        overflow: hidden;
        color: var(--loader-text);
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.45px;
        text-transform: uppercase;
      }

      .loader-track {
        position: relative;
        width: 198px;
        height: 3px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(40, 122, 75, 0.12);
      }

      .loader-track::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(40, 122, 75, 0.7),
          transparent
        );
        content: "";
        transform: translateX(-100%);
        animation: loader-progress 1.65s ease-in-out infinite;
      }

      @keyframes loader-shimmer {
        0%,
        15% {
          transform: translateX(-55%);
        }
        75%,
        100% {
          transform: translateX(55%);
        }
      }

      @keyframes loader-progress {
        to {
          transform: translateX(100%);
        }
      }

      @keyframes menu-row-shimmer {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }

      @keyframes loader-breathe {
        0%,
        100% {
          opacity: 0.72;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1.03);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loader::before,
        #app-loader::after,
        .loader-ring,
        .loader-ring::after,
        .loader-track::after {
          animation-duration: 8s;
        }
      }
    </style>

    <script>
      (function () {
        const root = document.documentElement;
        const viewport = window.visualViewport;

        function setViewportHeight() {
          const viewportHeight = viewport ? viewport.height : 0;
          const height = Math.round(viewportHeight || window.innerHeight);

          if (height > 0) {
            root.style.setProperty("--app-viewport-height", height + "px");
          }
        }

        function refreshFlutterLayout() {
          setViewportHeight();
          window.dispatchEvent(new Event("resize"));
        }

        function refreshAfterKeyboardClose() {
          [0, 80, 180, 360, 720].forEach(function (delay) {
            window.setTimeout(refreshFlutterLayout, delay);
          });
        }

        setViewportHeight();
        window.addEventListener("resize", setViewportHeight, { passive: true });
        window.addEventListener(
          "orientationchange",
          refreshAfterKeyboardClose,
          {
            passive: true,
          },
        );
        window.addEventListener("focusout", refreshAfterKeyboardClose, {
          passive: true,
        });

        if (viewport) {
          viewport.addEventListener("resize", setViewportHeight, {
            passive: true,
          });
          viewport.addEventListener("scroll", setViewportHeight, {
            passive: true,
          });
        }
      })();
    </script>

    <div id="app-loader" aria-live="polite" role="status">
      <div class="loader-ring" aria-hidden="true"></div>
      <div class="loader-text">Preparing your menu</div>
      <div class="loader-track" aria-hidden="true"></div>
    </div>

    <script>
      window.addEventListener("flutter-first-frame", function () {
        const loader = document.getElementById("app-loader");
        if (!loader) return;
        loader.classList.add("hidden");
        setTimeout(function () {
          loader.remove();
        }, 500);
      });
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
